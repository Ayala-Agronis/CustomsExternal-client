<div class="sidebar">
  <ul class="sidebar-menu">
    <li>
      <a routerLink="/home-page" class="menu-item" pTooltip="ראשי" tooltipPosition="left">
        <i class="pi pi-home"></i>
        <span>ראשי</span>
      </a>
    </li>
    <li>
      <a routerLink="/dec-query" class="menu-item" pTooltip="הצהרות שלי" tooltipPosition="left">
        <i class="pi pi-user"></i>
        <span>הצהרות שלי</span>
      </a>
    </li>
    <li
      class="submenu-container"
      (mouseenter)="showSubmenu = true"
      (mouseleave)="showSubmenu = false"
    >
      <a class="menu-item" pTooltip="הצהרה חדשה" tooltipPosition="left">
        <i class="pi pi-cog"></i>
        <span>הצהרה חדשה</span>
      </a>
      <ul class="submenu" *ngIf="showSubmenu">
        <li (click)="navigateToNewDeclaration('import')">הצהרת יבוא</li>
        <li class="no-click">הצהרת יצוא</li>
        <li (click)="navigateToNewDeclaration('transshipment')">הצהרת שטעון</li>
      </ul>
    </li>

    <li>
      <a
        routerLink="/personal-details"
        [queryParams]="{ personalDetails: true }"
        class="menu-item"
        pTooltip="פרטים אישיים"
        tooltipPosition="left"
      >
        <i class="pi pi-user"></i>
        <span>פרטים אישיים</span>
      </a>
    </li>
    <li>
      <a
        href="https://www.gov.il/he/service/power-of-attorney"
        target="_blank"
        rel="noopener noreferrer"
        class="menu-item"
        pTooltip="יפוי כח"
        tooltipPosition="left"
      >
        <i class="pi pi-file-edit"></i>
        <span>יפוי כח</span>
      </a>
    </li>
  </ul>

  <div class="logout">
    <a (click)="logout()" class="menu-item" pTooltip="התנתקות" tooltipPosition="left">
      <i class="pi pi-sign-out"></i>
      <span>התנתקות</span>
    </a>
  </div>
</div>
